# Install this file as /etc/nginx/conf.d/competition-platform.conf after
# obtaining the certificate shown below.  The platform itself must listen on
# 127.0.0.1:6190; do not expose its three child-service ports.

map "$uri|$arg_v" $competition_cache_control {
    default                                                "no-store, max-age=0";
    ~^/_next/static/                                       "public, max-age=31536000, immutable";
    ~^/models/                                             "public, max-age=86400";
    ~^/(?:python|blockly)/.*\.(?:wasm|onnx|bin|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)\| "public, max-age=86400";
    ~^/(?:python|blockly)/.*\.(?:js|css)\|.+$              "public, max-age=31536000, immutable";
    ~^/(?:python|blockly)/.*\.(?:js|css)\|$                "public, max-age=3600, must-revalidate";
    ~^/(?:platform-(?:admin|login|portal)\.js|(?:admin|platform|portal)\.css)\| "public, max-age=3600, must-revalidate";
}

upstream chenlong_competition_platform {
    server 127.0.0.1:6190;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name competition.chenlongrobot.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name competition.chenlongrobot.com;

    ssl_certificate /etc/letsencrypt/live/competition.chenlongrobot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/competition.chenlongrobot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:competition_tls:20m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 64m;

    # Do not preload or add includeSubDomains until every subdomain is known to
    # support HTTPS.  One year protects repeat visitors to this competition host.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Optional: stock Ubuntu Nginx does not include ngx_brotli.  Only uncomment
    # these directives after installing and loading that module, otherwise
    # `nginx -t` will fail.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://chenlong_competition_platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Overwrite, rather than append, browser-supplied forwarding headers.
        # The application must trust only this Nginx connection address via
        # CHENLONG_PLATFORM_TRUSTED_PROXIES.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";

        proxy_set_header Connection "";
        # Preserve resumable downloads for WASM, ONNX and model shards.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        proxy_request_buffering on;

        # The gateway returns conservative no-store headers.  Replace them with
        # bounded caching only for the allow-listed static paths in the map.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $competition_cache_control always;
    }
}
